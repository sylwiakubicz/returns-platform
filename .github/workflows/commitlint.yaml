name: commitlint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PATTERN='^(feat|fix|docs|refactor|test|chore|build|ci|revert)(\([a-z0-9-]+\))?!?: .{1,72}$'
          failed=0
          while read -r msg; do
            grep -qE "$PATTERN" <<<"$msg" \
              || { echo "::error::invalid commit message: $msg"; failed=1; }
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          exit $failed
