apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: infra
  labels: { tier: infra }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak, tier: infra }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          ports:
            - containerPort: 8080
            - containerPort: 9000
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: infra-credentials, key: KEYCLOAK_ADMIN_PASSWORD }
          args:
            - "start-dev"
          resources:
            requests: { memory: 400Mi, cpu: 100m }
            limits:   { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: 9000 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: keycloak, namespace: infra }
spec:
  type: NodePort
  selector: { app: keycloak }
  ports:
    - {name: app,  port: 8080, targetPort: 8080, nodePort: 30808 }
    - {name: management, port: 9000, targetPort: 9000, nodePort: 30809 }
