apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: infra
  labels: { tier: infra }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry, tier: infra }
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits:   { memory: 100Mi }
          readinessProbe:
            httpGet: { path: /v2/, port: 5000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /v2/, port: 5000 }
            initialDelaySeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: registry-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: registry-data, namespace: infra }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: registry, namespace: infra }
spec:
  type: NodePort
  selector: { app: registry }
  ports:
    - { port: 5000, targetPort: 5000, nodePort: 30500 }
