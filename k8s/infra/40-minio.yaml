apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: infra
  labels: { tier: infra }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio, tier: infra }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-09-13T20-26-02Z
          ports:
            - containerPort: 9000
            - containerPort: 9001
          envFrom:
            - secretRef:
                name: infra-credentials
          args:
            - "server"
            - "/data"
            - "--console-address"
            - ":9001"
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { memory: 200Mi, cpu: 50m }
            limits:   { memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: minio-data, namespace: infra }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: infra }
spec:
  type: NodePort
  selector: { app: minio }
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      nodePort: 30900

    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
