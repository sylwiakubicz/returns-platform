apiVersion: apps/v1
kind: Deployment
metadata: { name: schema-registry, namespace: infra }
spec:
  replicas: 1
  selector:
    matchLabels: { app: schema-registry }
  template:
    metadata:
      labels: { app: schema-registry, tier: infra }
    spec:
      enableServiceLinks: false
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:7.7.1
          ports: [{ containerPort: 8081 }]
          env:
            - { name: SCHEMA_REGISTRY_HOST_NAME, value: "schema-registry" }
            - { name: SCHEMA_REGISTRY_LISTENERS, value: "http://0.0.0.0:8081" }
            - { name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS,
                value: "PLAINTEXT://kafka-0.kafka.infra.svc.cluster.local:9092" }
            - { name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL, value: "backward" }
            - { name: SCHEMA_REGISTRY_HEAP_OPTS, value: "-Xmx256m" }
          resources:
            requests: { memory: 320Mi, cpu: 100m }
            limits:   { memory: 400Mi }
          readinessProbe:
            httpGet: { path: /subjects, port: 8081 }
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /subjects, port: 8081 }

            initialDelaySeconds: 90
---
apiVersion: v1
kind: Service
metadata: { name: schema-registry, namespace: infra }
spec:
  type: NodePort
  selector: { app: schema-registry }
  ports: [{ port: 8081, targetPort: 8081, nodePort: 30081 }]
