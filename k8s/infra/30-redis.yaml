apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: infra
  labels: { tier: infra }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis, tier: infra }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - containerPort: 6379
          args:
            - "--maxmemory"
            - "150mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits:   { memory: 128Mi }
          readinessProbe:
            exec:
              command: [ "redis-cli", "ping" ]
            initialDelaySeconds: 5

          livenessProbe:
            exec:
              command: [ "redis-cli", "ping" ]
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: infra }
spec:
  type: NodePort
  selector: { app: redis }
  ports:
    - { port: 6379, targetPort: 6379, nodePort: 30379 }
