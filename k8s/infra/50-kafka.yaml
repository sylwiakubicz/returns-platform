apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka, namespace: infra }
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka, tier: infra }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - { containerPort: 9092, name: internal }
            - { containerPort: 9093, name: controller }
            - { containerPort: 9094, name: external }
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS,
                value: "1@kafka-0.kafka.infra.svc.cluster.local:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "INTERNAL" }
            - { name: KAFKA_LISTENERS,
                value: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094" }
            - { name: KAFKA_ADVERTISED_LISTENERS,
                value: "INTERNAL://kafka-0.kafka.infra.svc.cluster.local:9092,EXTERNAL://${VM_HOST}:30092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP,
                value: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_NUM_PARTITIONS, value: "6" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx1g -Xms1g" }
            - { name: CLUSTER_ID, value: "${KAFKA_CLUSTER_ID}" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka }
          resources:
            requests: { memory: 900Mi, cpu: 500m }
            limits:   { memory: 900Mi }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 60
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: infra }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: kafka }
  ports:
    - { port: 9092, name: internal }
    - { port: 9093, name: controller }
---
apiVersion: v1
kind: Service
metadata: { name: kafka-external, namespace: infra }
spec:
  type: NodePort
  selector: { app: kafka }
  ports: [{ port: 9094, targetPort: 9094, nodePort: 30092 }]
