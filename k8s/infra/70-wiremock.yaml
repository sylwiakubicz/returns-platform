apiVersion: v1
kind: ConfigMap
metadata:
  name: wiremock-mappings
  namespace: infra
data: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiremock
  namespace: infra
  labels: { tier: infra }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: wiremock }
  template:
    metadata:
      labels: { app: wiremock, tier: infra }
    spec:
      containers:
        - name: wiremock
          image: wiremock/wiremock:3.9.1
          ports:
            - containerPort: 8080
          args:
            - "--global-response-templating"
            - "--verbose"
          volumeMounts:
            - name: mappings
              mountPath: /home/wiremock/mappings
          resources:
            requests: { memory: 192Mi, cpu: 50m }
            limits:   { memory: 256Mi }
      volumes:
        - name: mappings
          configMap:
            name: wiremock-mappings
---
apiVersion: v1
kind: Service
metadata: { name: wiremock, namespace: infra }
spec:
  type: NodePort
  selector: { app: wiremock }
  ports:
    - { port: 8080, targetPort: 8080, nodePort: 30888 }

