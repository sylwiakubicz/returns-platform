"openapi": "3.0.3"
"info":
  "title": "Returns API"
  "version": "1.0.0"
  "description": "Stage 3, step 6 contract. Public routes address returns by business number. Simulation routes are temporary; administration routes remain. Authentication is introduced in stage 4."
"servers":
  -
    "url": "http://localhost:8080"
    "description": "Local development"
"security": []
"tags":
  -
    "name": "Returns"
    "description": "Customer return commands and queries."
  -
    "name": "Simulation"
    "description": "Temporary integration simulations removed in project stage 6."
  -
    "name": "Administration"
    "description": "Permanent operational endpoints."
"paths":
  "/api/v1/returns":
    "post":
      "operationId": "createReturn"
      "summary": "Create a return"
      "tags":
        - "Returns"
      "responses":
        "201":
          "description": "Return created. Replays return the same status, body and Location."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReturnView"
          "headers":
            "Location":
              "description": "Relative URI of the created return, using its business number. Replayed unchanged."
              "schema":
                "type": "string"
                "format": "uri-reference"
                "example": "/api/v1/returns/RMA-2026-000001"
        "400":
          "$ref": "#/components/responses/Error400"
        "422":
          "$ref": "#/components/responses/Error422"
        "406":
          "description": "The Accept header does not allow a JSON response."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetail"
        "415":
          "description": "Content-Type must be application/json."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetail"
        "500":
          "$ref": "#/components/responses/Error500"
      "description": "API is open until project stage 4. IDs and request time are assigned by the server. All item currencies must equal currency. Event append, projection update and idempotency response storage commit atomically. Idempotency is scoped to key plus endpoint; SHA-256 is calculated over the exact request body bytes. Changing whitespace also changes the hash. Concurrent identical requests create one return and replay its response. Failed transactions do not reserve keys. Records expire after 24 hours; reuse after expiry can create a new return."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateReturnRequest"
      "parameters":
        -
          "name": "Idempotency-Key"
          "in": "header"
          "required": true
          "description": "Client-generated key identifying a single creation attempt; retained for 24 hours."
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 255
    "get":
      "operationId": "listReturns"
      "summary": "List returns"
      "tags":
        - "Returns"
      "responses":
        "200":
          "description": "Page from the projection."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReturnPage"
        "400":
          "$ref": "#/components/responses/Error400"
        "406":
          "description": "The Accept header does not allow a JSON response."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetail"
        "500":
          "$ref": "#/components/responses/Error500"
      "description": "Zero-based pages. Stable order by business_number descending. Oversized pages are rejected with 400. Projection data can lag behind writes in future stages; each item exposes updatedAt."
      "parameters":
        -
          "name": "page"
          "in": "query"
          "description": "Zero-based page index."
          "schema":
            "type": "integer"
            "minimum": 0
            "default": 0
        -
          "name": "size"
          "in": "query"
          "description": "Maximum 100 items; values above the limit are rejected."
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
        -
          "name": "status"
          "in": "query"
          "description": "Optional exact state filter."
          "schema":
            "$ref": "#/components/schemas/RmaStatus"
  "/api/v1/returns/{businessNumber}":
    "parameters":
      -
        "$ref": "#/components/parameters/BusinessNumber"
    "get":
      "operationId": "getReturn"
      "summary": "Get a return"
      "tags":
        - "Returns"
      "responses":
        "200":
          "description": "Current projection and its freshness timestamp."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReturnView"
        "400":
          "$ref": "#/components/responses/Error400"
        "404":
          "$ref": "#/components/responses/Error404"
        "406":
          "description": "The Accept header does not allow a JSON response."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetail"
        "500":
          "$ref": "#/components/responses/Error500"
  "/api/v1/returns/{businessNumber}/cancel":
    "parameters":
      -
        "$ref": "#/components/parameters/BusinessNumber"
    "post":
      "operationId": "cancelReturn"
      "summary": "Cancel a return"
      "tags":
        - "Returns"
      "responses":
        "204":
          "description": "Cancellation recorded."
        "400":
          "$ref": "#/components/responses/Error400"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "415":
          "description": "Content-Type must be application/json."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetail"
        "500":
          "$ref": "#/components/responses/Error500"
      "description": "Allowed in REQUESTED, LABEL_ISSUED and PICKUP_SCHEDULED. Records RmaCancelled and leaves the return in CANCELLED; closure is a separate command. cancelledBy is supplied explicitly until authentication is introduced in stage 4. Cancellation time is server-assigned."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CancelReturnRequest"
  "/api/v1/returns/{businessNumber}/history":
    "parameters":
      -
        "$ref": "#/components/parameters/BusinessNumber"
    "get":
      "operationId": "getReturnHistory"
      "summary": "Get full return history"
      "tags":
        - "Returns"
      "responses":
        "200":
          "description": "All events in ascending version order, including events preceding snapshots."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReturnHistory"
        "400":
          "$ref": "#/components/responses/Error400"
        "404":
          "$ref": "#/components/responses/Error404"
        "406":
          "description": "The Accept header does not allow a JSON response."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetail"
        "500":
          "$ref": "#/components/responses/Error500"
      "description": "Reads the event store, not the projection or snapshots. Payloads are upcast to the current schema; schemaVersion describes the returned payload version. Event IDs, aggregate versions and occurrence times remain unchanged."
  "/internal/sim/returns/{businessNumber}/label-issued":
    "parameters":
      -
        "$ref": "#/components/parameters/BusinessNumber"
    "post":
      "operationId": "issueLabel"
      "summary": "Simulate label-issued"
      "tags":
        - "Simulation"
      "responses":
        "204":
          "description": "Simulated command and resulting events recorded."
        "400":
          "$ref": "#/components/responses/Error400"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "415":
          "description": "Content-Type must be application/json."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetail"
        "500":
          "$ref": "#/components/responses/Error500"
      "description": "REQUESTED → LABEL_ISSUED. Event times are assigned by the server. Temporary simulation endpoint, removed in project stage 6 when service integrations replace it."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/IssueLabelRequest"
      "deprecated": true
  "/internal/sim/returns/{businessNumber}/pickup-scheduled":
    "parameters":
      -
        "$ref": "#/components/parameters/BusinessNumber"
    "post":
      "operationId": "schedulePickup"
      "summary": "Simulate pickup-scheduled"
      "tags":
        - "Simulation"
      "responses":
        "204":
          "description": "Simulated command and resulting events recorded."
        "400":
          "$ref": "#/components/responses/Error400"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "415":
          "description": "Content-Type must be application/json."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetail"
        "500":
          "$ref": "#/components/responses/Error500"
      "description": "LABEL_ISSUED → PICKUP_SCHEDULED. Optional on the positive path. Event times are assigned by the server. Temporary simulation endpoint, removed in project stage 6 when service integrations replace it."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/SchedulePickupRequest"
      "deprecated": true
  "/internal/sim/returns/{businessNumber}/parcel-in-transit":
    "parameters":
      -
        "$ref": "#/components/parameters/BusinessNumber"
    "post":
      "operationId": "markParcelInTransit"
      "summary": "Simulate parcel-in-transit"
      "tags":
        - "Simulation"
      "responses":
        "204":
          "description": "Simulated command and resulting events recorded."
        "400":
          "$ref": "#/components/responses/Error400"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "500":
          "$ref": "#/components/responses/Error500"
      "description": "LABEL_ISSUED or PICKUP_SCHEDULED → IN_TRANSIT. Event times are assigned by the server. Temporary simulation endpoint, removed in project stage 6 when service integrations replace it."
      "deprecated": true
  "/internal/sim/returns/{businessNumber}/parcel-received":
    "parameters":
      -
        "$ref": "#/components/parameters/BusinessNumber"
    "post":
      "operationId": "receiveParcel"
      "summary": "Simulate parcel-received"
      "tags":
        - "Simulation"
      "responses":
        "204":
          "description": "Simulated command and resulting events recorded."
        "400":
          "$ref": "#/components/responses/Error400"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "415":
          "description": "Content-Type must be application/json."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetail"
        "500":
          "$ref": "#/components/responses/Error500"
      "description": "IN_TRANSIT → RECEIVED. Event times are assigned by the server. Temporary simulation endpoint, removed in project stage 6 when service integrations replace it."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ReceiveParcelRequest"
      "deprecated": true
  "/internal/sim/returns/{businessNumber}/inspection-started":
    "parameters":
      -
        "$ref": "#/components/parameters/BusinessNumber"
    "post":
      "operationId": "startInspection"
      "summary": "Simulate inspection-started"
      "tags":
        - "Simulation"
      "responses":
        "204":
          "description": "Simulated command and resulting events recorded."
        "400":
          "$ref": "#/components/responses/Error400"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "415":
          "description": "Content-Type must be application/json."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetail"
        "500":
          "$ref": "#/components/responses/Error500"
      "description": "RECEIVED → UNDER_INSPECTION. Event times are assigned by the server. Temporary simulation endpoint, removed in project stage 6 when service integrations replace it."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/StartInspectionRequest"
      "deprecated": true
  "/internal/sim/returns/{businessNumber}/inspection-completed":
    "parameters":
      -
        "$ref": "#/components/parameters/BusinessNumber"
    "post":
      "operationId": "completeInspection"
      "summary": "Simulate inspection-completed"
      "tags":
        - "Simulation"
      "responses":
        "204":
          "description": "Simulated command and resulting events recorded."
        "400":
          "$ref": "#/components/responses/Error400"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "415":
          "description": "Content-Type must be application/json."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetail"
        "500":
          "$ref": "#/components/responses/Error500"
      "description": "Records InspectionCompleted and RefundDecided atomically. Results must cover every item exactly once. Supervisor approval is required for grade D above the configured threshold. UNDER_INSPECTION → REFUND_PENDING or REJECTED. Event times are assigned by the server. Temporary simulation endpoint, removed in project stage 6 when service integrations replace it."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CompleteInspectionRequest"
      "deprecated": true
  "/internal/sim/returns/{businessNumber}/refund-executed":
    "parameters":
      -
        "$ref": "#/components/parameters/BusinessNumber"
    "post":
      "operationId": "executeRefund"
      "summary": "Simulate refund-executed"
      "tags":
        - "Simulation"
      "responses":
        "204":
          "description": "Simulated command and resulting events recorded."
        "400":
          "$ref": "#/components/responses/Error400"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "415":
          "description": "Content-Type must be application/json."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetail"
        "500":
          "$ref": "#/components/responses/Error500"
      "description": "REFUND_PENDING → REFUNDED. Amount and currency must match the refund decision. Event times are assigned by the server. Temporary simulation endpoint, removed in project stage 6 when service integrations replace it."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ExecuteRefundRequest"
      "deprecated": true
  "/internal/sim/returns/{businessNumber}/close":
    "parameters":
      -
        "$ref": "#/components/parameters/BusinessNumber"
    "post":
      "operationId": "closeReturn"
      "summary": "Simulate close"
      "tags":
        - "Simulation"
      "responses":
        "204":
          "description": "Simulated command and resulting events recorded."
        "400":
          "$ref": "#/components/responses/Error400"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "415":
          "description": "Content-Type must be application/json."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetail"
        "500":
          "$ref": "#/components/responses/Error500"
      "description": "Records RmaClosed. Closure reason must match the terminal state; REFUNDED uses REFUND_COMPLETED. → CLOSED. Event times are assigned by the server. Temporary simulation endpoint, removed in project stage 6 when service integrations replace it."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CloseReturnRequest"
      "deprecated": true
  "/admin/projections/rebuild":
    "post":
      "operationId": "rebuildProjections"
      "summary": "Rebuild return projections"
      "tags":
        - "Administration"
      "responses":
        "204":
          "description": "Projection rebuild completed."
        "400":
          "$ref": "#/components/responses/Error400"
        "500":
          "$ref": "#/components/responses/Error500"
      "description": "Permanent administrative endpoint. Synchronously rebuilds the projection from the complete event store. Open in stage 3; supervisor authorization is introduced in project stage 4."
"components":
  "parameters":
    "BusinessNumber":
      "name": "businessNumber"
      "in": "path"
      "required": true
      "description": "Immutable business number, never the aggregate UUID."
      "schema":
        "$ref": "#/components/schemas/BusinessNumber"
  "responses":
    "Error400":
      "description": "Malformed request, invalid field, missing Idempotency-Key, invalid business number, page size or filter. Validation failures include errors with field and message."
      "content":
        "application/problem+json":
          "schema":
            "$ref": "#/components/schemas/ProblemDetail"
    "Error404":
      "description": "No return exists with this business number."
      "content":
        "application/problem+json":
          "schema":
            "$ref": "#/components/schemas/ProblemDetail"
    "Error409":
      "description": "Concurrency conflict or a command forbidden in the current state."
      "content":
        "application/problem+json":
          "schema":
            "$ref": "#/components/schemas/ProblemDetail"
    "Error422":
      "description": "Domain rules reject the request, or an Idempotency-Key is reused with a different request body."
      "content":
        "application/problem+json":
          "schema":
            "$ref": "#/components/schemas/ProblemDetail"
    "Error500":
      "description": "Unexpected server error; internal details are not exposed."
      "content":
        "application/problem+json":
          "schema":
            "$ref": "#/components/schemas/ProblemDetail"
  "schemas":
    "RmaStatus":
      "type": "string"
      "enum":
        - "REQUESTED"
        - "LABEL_ISSUED"
        - "PICKUP_SCHEDULED"
        - "IN_TRANSIT"
        - "RECEIVED"
        - "UNDER_INSPECTION"
        - "REFUND_PENDING"
        - "REFUND_FAILED"
        - "REFUNDED"
        - "REJECTED"
        - "EXPIRED"
        - "LOST"
        - "CANCELLED"
        - "CLOSED"
    "RmaReason":
      "type": "string"
      "enum":
        - "CHANGED_MIND"
        - "WRONG_ITEM"
        - "DAMAGED_IN_TRANSIT"
        - "DEFECTIVE"
        - "NOT_AS_DESCRIBED"
    "ItemGrade":
      "type": "string"
      "enum":
        - "A"
        - "B"
        - "C"
        - "D"
    "RefundDecision":
      "type": "string"
      "enum":
        - "FULL"
        - "PARTIAL"
        - "REJECTED"
    "FailureCode":
      "type": "string"
      "enum":
        - "TIMEOUT"
        - "PROVIDER_UNAVAILABLE"
        - "RATE_LIMITED"
        - "INSUFFICIENT_FUNDS"
        - "INVALID_ACCOUNT"
        - "REJECTED_BY_PROVIDER"
    "ClosureReason":
      "type": "string"
      "enum":
        - "REFUND_COMPLETED"
        - "REJECTED_AFTER_INSPECTION"
        - "EXPIRED_NO_SHIPMENT"
        - "PARCEL_LOST"
        - "CANCELLED_BY_CUSTOMER"
        - "CLOSED_BY_OPERATOR"
    "BusinessNumber":
      "type": "string"
      "pattern": "^RMA-[0-9]{4}-[0-9]{6}$"
      "example": "RMA-2026-000001"
    "Currency":
      "type": "string"
      "pattern": "^[A-Z]{3}$"
      "description": "ISO 4217 currency code."
      "example": "PLN"
    "Money":
      "type": "object"
      "additionalProperties": false
      "required":
        - "amount"
        - "currency"
      "properties":
        "amount":
          "type": "string"
          "pattern": "^[0-9]+\\.[0-9]{2}$"
          "example": "100.00"
          "description": "Exact decimal amount; serialized as a string to preserve monetary precision."
        "currency":
          "$ref": "#/components/schemas/Currency"
    "RequestedItem":
      "type": "object"
      "additionalProperties": false
      "required":
        - "itemId"
        - "sku"
        - "name"
        - "quantity"
        - "unitPrice"
      "properties":
        "itemId":
          "type": "string"
          "minLength": 1
        "sku":
          "type": "string"
          "minLength": 1
        "name":
          "type": "string"
          "minLength": 1
        "quantity":
          "type": "integer"
          "minimum": 1
        "unitPrice":
          "$ref": "#/components/schemas/Money"
    "InspectionResult":
      "type": "object"
      "additionalProperties": false
      "required":
        - "itemId"
        - "grade"
      "properties":
        "itemId":
          "type": "string"
          "minLength": 1
        "grade":
          "$ref": "#/components/schemas/ItemGrade"
        "note":
          "type": "string"
          "maxLength": 500
          "nullable": true
        "photoKeys":
          "type": "array"
          "items":
            "type": "string"
            "minLength": 1
    "ItemRefundDecision":
      "type": "object"
      "additionalProperties": false
      "required":
        - "itemId"
        - "grade"
        - "deductionPercent"
        - "refundableAmount"
      "properties":
        "itemId":
          "type": "string"
          "minLength": 1
        "grade":
          "$ref": "#/components/schemas/ItemGrade"
        "deductionPercent":
          "type": "integer"
          "minimum": 0
          "maximum": 100
        "refundableAmount":
          "$ref": "#/components/schemas/Money"
    "CreateReturnRequest":
      "type": "object"
      "additionalProperties": false
      "required":
        - "orderId"
        - "customerId"
        - "orderDeliveredAt"
        - "reason"
        - "currency"
        - "items"
      "properties":
        "orderId":
          "type": "string"
          "minLength": 1
        "customerId":
          "type": "string"
          "minLength": 1
        "orderDeliveredAt":
          "type": "string"
          "format": "date-time"
        "reason":
          "$ref": "#/components/schemas/RmaReason"
        "customerNote":
          "type": "string"
          "maxLength": 1000
          "nullable": true
        "currency":
          "$ref": "#/components/schemas/Currency"
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/RequestedItem"
          "minItems": 1
    "ReturnView":
      "type": "object"
      "additionalProperties": false
      "required":
        - "businessNumber"
        - "status"
        - "refundAmount"
        - "updatedAt"
      "properties":
        "businessNumber":
          "$ref": "#/components/schemas/BusinessNumber"
        "status":
          "$ref": "#/components/schemas/RmaStatus"
        "refundAmount":
          "type": "object"
          "additionalProperties": false
          "required":
            - "amount"
            - "currency"
          "properties":
            "amount":
              "type": "string"
              "pattern": "^[0-9]+\\.[0-9]{2}$"
              "example": "100.00"
              "description": "Exact decimal amount; serialized as a string to preserve monetary precision."
            "currency":
              "$ref": "#/components/schemas/Currency"
          "nullable": true
          "description": "Null until a refund decision exists."
        "updatedAt":
          "type": "string"
          "format": "date-time"
          "description": "Time of the latest event applied to this projection, not the HTTP response time."
    "ReturnPage":
      "type": "object"
      "additionalProperties": false
      "required":
        - "content"
        - "page"
        - "size"
        - "totalElements"
        - "totalPages"
      "properties":
        "content":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ReturnView"
        "page":
          "type": "integer"
          "minimum": 0
        "size":
          "type": "integer"
          "minimum": 1
